
name: Build (Nuitka + PyInstaller)

on:
  workflow_dispatch:
    inputs:
      build_nuitka:
        description: "Build con Nuitka"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      build_pyinstaller:
        description: "Build con PyInstaller"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Dipendenze di sistema utili a Nuitka su Linux
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ patchelf

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # Installa dipendenze runtime (GUI/Qt ecc.)
      - name: Install project requirements
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
        shell: bash

      # Installa i tool di build
      - name: Install build tools (Nuitka + PyInstaller)
        run: |
          python -m pip install nuitka pyinstaller
        shell: bash

      # Cartelle output uniformi
      - name: Prepare dist folders
        run: |
          mkdir -p dist/pyinstaller dist/nuitka artifacts
        shell: bash

      # -----------------------
      # PYINSTALLER BUILDS
      # -----------------------
      - name: PyInstaller - CLI (onefile)
        if: ${{ inputs.build_pyinstaller == 'true' }}
        run: |
          python -m PyInstaller --clean --noconfirm \
            --onefile \
            -n vw-cleaner-cli \
            vw_cleaner_cli.py
        shell: bash

      - name: PyInstaller - GUI (onefile)
        if: ${{ inputs.build_pyinstaller == 'true' }}
        run: |
          # GUI: su Windows/macOS spesso meglio senza console (Windows) ma PyInstaller la gestisce con --noconsole.
          python -m PyInstaller --clean --noconfirm \
            --onefile \
            --noconsole \
            -n vw-cleaner-gui \
            vw_cleaner_gui.py
        shell: bash

      - name: Collect PyInstaller outputs
        if: ${{ inputs.build_pyinstaller == 'true' }}
        run: |
          # PyInstaller mette i binari in dist/ (cartella default di PyInstaller)
          # Spostiamo dentro dist/pyinstaller per ordine
          if [ -d "dist" ]; then
            # Evita di spostare la cartella dist/pyinstaller stessa (che abbiamo creato)
            # Sposta solo i file eseguibili generati
            find dist -maxdepth 1 -type f -exec mv {} dist/pyinstaller/ \; || true
          fi
        shell: bash

      # -----------------------
      # NUITKA BUILDS
      # -----------------------
      - name: Nuitka - CLI (onefile)
        if: ${{ inputs.build_nuitka == 'true' }}
        run: |
          python -m nuitka \
            --onefile \
            --output-dir=dist/nuitka \
            --assume-yes-for-downloads \
            vw_cleaner_cli.py
        shell: bash

      - name: Nuitka - GUI (onefile, Qt plugin)
        if: ${{ inputs.build_nuitka == 'true' }}
        run: |
          # Per PySide6 consigliato abilitare plugin Qt
          # Su Windows aggiungiamo anche disable-console
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m nuitka \
              --onefile \
              --enable-plugin=pyside6 \
              --windows-disable-console \
              --output-dir=dist/nuitka \
              --assume-yes-for-downloads \
              vw_cleaner_gui.py
          else
            python -m nuitka \
              --onefile \
              --enable-plugin=pyside6 \
              --output-dir=dist/nuitka \
              --assume-yes-for-downloads \
              vw_cleaner_gui.py
          fi
        shell: bash

      # -----------------------
      # PACKAGE ARTIFACTS
      # -----------------------
      - name: Create artifact bundle
        run: |
          OS="${{ runner.os }}"
          mkdir -p artifacts

          # Copia contenuti (se esistono)
          if [ -d dist/pyinstaller ]; then
            mkdir -p "artifacts/${OS}/pyinstaller"
            cp -R dist/pyinstaller/* "artifacts/${OS}/pyinstaller/" 2>/dev/null || true
          fi

          if [ -d dist/nuitka ]; then
            mkdir -p "artifacts/${OS}/nuitka"
            cp -R dist/nuitka/* "artifacts/${OS}/nuitka/" 2>/dev/null || true
          fi

          # Zip (su Windows runner può non avere zip in bash; usiamo python per fare zip cross-platform)
          python - << 'PY'
          import os, zipfile, pathlib
          osname = os.environ.get("RUNNER_OS", "Unknown")
          base = pathlib.Path("artifacts")/osname
          out = pathlib.Path(f"vw-cleaner_{osname}.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
            if base.exists():
              for p in base.rglob("*"):
                if p.is_file():
                  z.write(p, p.relative_to("artifacts"))
          print("Created", out)
          PY
        shell: bash

      - name: Upload artifacts (zip)
        uses: actions/upload-artifact@v4
        with:
          name: vw-cleaner-${{ runner.os }}
          path: |
            vw-cleaner            vw-cleaner_${{ runner.os }}.zip
          if-no-files-found: error
