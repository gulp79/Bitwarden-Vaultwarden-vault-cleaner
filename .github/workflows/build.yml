
name: Build (Nuitka + PyInstaller)

on:
  workflow_dispatch:
    inputs:
      build_nuitka:
        description: "Build con Nuitka"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      build_pyinstaller:
        description: "Build con PyInstaller"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ patchelf
        shell: bash

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel
        shell: bash

      - name: Install project requirements (if present)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
        shell: bash

      - name: Install build tools (Nuitka + PyInstaller)
        run: |
          python -m pip install nuitka pyinstaller
        shell: bash

      - name: Syntax check (compileall)
        run: python -m compileall -q .
        shell: bash

      - name: Prepare output folders
        run: |
          rm -rf dist build
          mkdir -p dist/pyinstaller dist/nuitka
        shell: bash

      # -----------------------
      # PYINSTALLER BUILDS
      # -----------------------
      - name: PyInstaller - CLI (onefile)
        if: ${{ inputs.build_pyinstaller == 'true' }}
        run: |
          python -m PyInstaller --clean --noconfirm \
            --onefile \
            --distpath dist/pyinstaller \
            --workpath build/pyinstaller \
            -n vw-cleaner-cli \
            vw_cleaner_cli.py
        shell: bash

      - name: PyInstaller - GUI (onefile)
        if: ${{ inputs.build_pyinstaller == 'true' }}
        run: |
          python -m PyInstaller --clean --noconfirm \
            --onefile \
            --noconsole \
            --distpath dist/pyinstaller \
            --workpath build/pyinstaller \
            -n vw-cleaner-gui \
            vw_cleaner_gui.py
        shell: bash

      # -----------------------
      # NUITKA BUILDS
      # -----------------------
      - name: Nuitka - CLI (onefile)
        if: ${{ inputs.build_nuitka == 'true' }}
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist/nuitka \
            --output-filename=vw-cleaner-cli \
            vw_cleaner_cli.py
        shell: bash

      - name: Nuitka - GUI (onefile, Qt)
        if: ${{ inputs.build_nuitka == 'true' }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m nuitka \
              --onefile \
              --enable-plugin=pyside6 \
              --windows-disable-console \
              --assume-yes-for-downloads \
              --output-dir=dist/nuitka \
              --output-filename=vw-cleaner-gui \
              vw_cleaner_gui.py
          else
            python -m nuitka \
              --onefile \
              --enable-plugin=pyside6 \
              --assume-yes-for-downloads \
              --output-dir=dist/nuitka \
              --output-filename=vw-cleaner-gui \
              vw_cleaner_gui.py
          fi
        shell: bash

      # -----------------------
      # DEBUG (sempre utile se qualcosa va storto)
      # -----------------------
      - name: Debug - list dist contents
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "---- dist tree ----"
          find dist -maxdepth 3 -type f -print || true
        shell: bash

      # -----------------------
      # UPLOAD ARTIFACTS (NO ZIP)
      # -----------------------
      - name: Upload artifacts (dist)
        uses: actions/upload-artifact@v4
        with:
          name: vw-cleaner-${{ runner.os }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

